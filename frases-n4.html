const frases = frasesTexto
    .split("\n")
    .map(linea => linea.split("|"));

const search = document.getElementById("search");
const filters = document.getElementById("filters");
const counter = document.getElementById("counter");
const container = document.getElementById("phrases");

let currentCategory = "Todas";

const categories = [
    "Todas",
    ...new Set(frases.map(f => f[0]))
];

categories.forEach(category => {

    const button = document.createElement("button");

    button.className =
        "filter" +
        (category === "Todas" ? " active" : "");

    button.textContent = category;

    button.addEventListener("click", () => {

        currentCategory = category;

        document
            .querySelectorAll(".filter")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        render();
    });

    filters.appendChild(button);
});

function render() {

    const query = search.value
        .toLowerCase()
        .trim();

    const filtered = frases.filter(f => {

        const matchesCategory =
            currentCategory === "Todas" ||
            f[0] === currentCategory;

        const text =
            f.join(" ").toLowerCase();

        return matchesCategory &&
               text.includes(query);
    });

    counter.textContent =
        `Mostrando ${filtered.length} de ${frases.length} frases`;

    container.innerHTML = "";

    if (filtered.length === 0) {

        container.innerHTML =
            '<div class="empty">No se encontraron frases.</div>';

        return;
    }

    filtered.forEach(f => {

        const [
            category,
            japanese,
            reading,
            spanish
        ] = f;

        const card =
            document.createElement("article");

        card.className = "card";

        card.innerHTML = `

            <div class="jp">
                ${japanese}
            </div>

            <div class="reading">
                ${reading}
            </div>

            <div class="meaning">
                ${spanish}
            </div>

            <div class="category">
                ${category}
            </div>

        `;

        container.appendChild(card);
    });
}

search.addEventListener("input", render);

render();

</script>
