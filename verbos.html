        );

        button.classList.add("active");
        render();
    });

    filters.appendChild(button);
});

function render() {
    const query = search.value.toLowerCase().trim();

    const filtered = verbs.filter(v => {
        const matchesCategory =
            currentCategory === "Todas" || v[0] === currentCategory;

        const text = v.join(" ").toLowerCase();

        return matchesCategory && text.includes(query);
    });

    counter.textContent =
        `Mostrando ${filtered.length} de ${verbs.length} verbos`;

    container.innerHTML = "";

    if (filtered.length === 0) {
        container.innerHTML =
            '<div class="empty">No se encontraron verbos.</div>';
        return;
    }

    filtered.forEach(v => {
        const [category, japanese, reading, meaning, example, exampleReading, exampleSpanish] = v;

        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
            <div class="word">${japanese}</div>
            <div class="reading">${reading}</div>
            <div class="meaning">${meaning}</div>

            <div class="example">
                <div class="example-jp">${example}</div>
                <div class="example-reading">${exampleReading}</div>
                <div class="example-es">${exampleSpanish}</div>
            </div>

            <div class="category">${category}</div>
        `;

        container.appendChild(card);
    });
}

search.addEventListener("input", render);
render();
</script>

</body>
</html>
